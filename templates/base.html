{% load static %}
{% load i18n %}
{% load cookielaw_tags %}
<!DOCTYPE html>
<html lang="lv">

<head>
	<meta charset="UTF-8">
	<title>SIA "Retrix" :: {% trans 'Par uzņēmumu' %}</title>
	<meta name="description"
		content="Uzņēmums nodarbojas ar LED lentu apgaismojuma montāžu, to vadības bloku programmēšanu un specifisku, ar gaismekļiem un sensoriem aprīkotu produktu izstrādi.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="preconnect" href="https://ka-f.fontawesome.com" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="canonical" href="https://www.retrix.lv/" />
	<link rel="alternate" hreflang="en" href="https://www.retrix.lv/en/" />
	<link rel="alternate" hreflang="ru" href="https://www.retrix.lv/ru/" />
	<link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />
	<link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />
	<link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
	<link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body>
	<div class="wrapper d-flex flex-column">
		<header>
			{% include 'inc/_nav.html' %}
		</header>
		<main>
			<div class="container-fluid">
				{% block content %}{% endblock %}
			</div>
		</main>
		{% cookielaw_banner %}
		<footer class="py-3 bg-dark">
			{% include 'inc/_foo.html' %}
		</footer>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
		integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
		crossorigin="anonymous"></script>
	<script src="https://kit.fontawesome.com/17b4039aee.js" crossorigin="anonymous"></script>
	<script src="{% static 'js/script.js' %}"></script>
	<script src="{% static 'js/modernizr-custom.js' %}"></script>
</body>

</html>
