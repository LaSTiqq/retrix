{% load static %}
{% load i18n %}
{% load cookielaw_tags %}
<!DOCTYPE html>
<html lang="lv">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description"
		content="Uzņēmums nodarbojas ar LED lentu apgaismojuma montāžu, to vadības bloku programmēšanu, un specifisku ar gaismekļiem un sensoriem aprīkotu produktu izstrādi">
	<link rel="canonical" href="https://www.retrix.lv/">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Oswald:wght@300;400&display=swap">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
	<link rel="stylesheet" href="{% static 'css/style.css' %}">
	<title>SIA "Retrix" :: {% trans 'Par uzņēmumu' %}</title>
</head>

<body>
	<div class="wrapper d-flex flex-column">
		<header>
			{% include 'inc/_nav.html' %}
		</header>
		<main>
			{% block content %}{% endblock %}
		</main>
		{% cookielaw_banner %}
		<footer class="py-3 bg-dark">
			{% include 'inc/_foo.html' %}
		</footer>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"
		integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
	<script src="https://kit.fontawesome.com/17b4039aee.js" crossorigin="anonymous"></script>
	<script src="{% static 'js/script.js' %}"></script>
</body>

</html>
